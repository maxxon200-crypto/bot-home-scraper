[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casa-watch-italia"
version = "0.1.0"
description = "A readable, local-first monitor for Italian homes for sale"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5"]
license = "MIT"

[project.scripts]
casa-watch = "casa_watch.cli:main"

[tool.setuptools.packages.find]
include = ["casa_watch*"]

[tool.setuptools.package-data]
casa_watch = ["defaults.toml", "assets/*.png"]
